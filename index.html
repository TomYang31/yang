<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智冷未來 - 彰師附工教室溫度監測</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f7f7f7;
        }
        .box {
            border: 1px solid #ccc;
            padding: 15px;
            max-width: 600px;
            background: #fff;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        /* 平均溫濕度區塊 */
        .avg-box {
            border: 2px solid #007bff;
            background: #eaf3ff;
        }
        .avg-grid {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }
        .avg-item {
            flex: 1;
            text-align: center;
        }
        .avg-item .label {
            font-size: 14px;
            color: #555;
        }
        .avg-item .value {
            font-size: 40px;
            font-weight: bold;
            color: #007bff;
        }
        .avg-note {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        .alert {
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
        }
        .cool { background-color: #d4edda; color: #155724; }
        .warm { background-color: #fff3cd; color: #856404; }
        .hot { background-color: #f8d7da; color: #721c24; }

        /* 感測器狀態表格 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 10px;
            text-align: center;
        }
        th {
            background: #f0f0f0;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .dot-on { background-color: #28a745; }
        .dot-off { background-color: #dc3545; }
        .status-text-on { color: #28a745; font-weight: bold; }
        .status-text-off { color: #dc3545; font-weight: bold; }

        .chart {
            margin-top: 15px;
        }
        .chart-note {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        .chart-canvas-wrap {
            position: relative;
            width: 100%;
            height: 260px;
        }
        .updated {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- 平均溫濕度區塊（只計算目前有接通的感測器）-->
    <div class="box avg-box">
        <h3>📊 彰師附工 平均溫溼度（僅計算已連線感測器）</h3>
        <hr>
        <div class="avg-grid">
            <div class="avg-item">
                <div class="label">平均溫度</div>
                <div class="value"><span id="avgTemp">--</span> °C</div>
            </div>
            <div class="avg-item">
                <div class="label">平均濕度</div>
                <div class="value"><span id="avgHumid">--</span> %</div>
            </div>
        </div>
        <div class="avg-note">
            溫度感測器連線數：<span id="tempCount">--</span>　|　
            濕度感測器連線數：<span id="humidCount">--</span>
        </div>
        <div id="alertCard" class="alert warm">資料讀取中...</div>
        <div class="updated">最後更新：<span id="lastUpdated">--</span></div>
    </div>

    <!-- 各感測器狀態表格 -->
    <div class="box">
        <h3>彰師附工 各感測器讀值</h3>
        <hr>
        <table>
            <thead>
                <tr>
                    <th>感測器</th>
                    <th>溫度 (°C)</th>
                    <th>濕度 (%)</th>
                    <th>狀態</th>
                </tr>
            </thead>
            <tbody id="sensorTableBody">
                <!-- JS 動態產生每一列 -->
            </tbody>
        </table>
    </div>

    <div class="box chart">
        <h3>平均溫度歷史圖表</h3>
        <div class="chart-note">每個時間點的數值 = 當下有連線的感測器溫度平均</div>
        <div class="chart-canvas-wrap">
            <canvas id="avgTempChart"></canvas>
        </div>
        <div id="chartStatus" class="chart-note"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script>
        const channelID = "3458958";
        const readApiKey = ""; // 若 channel 是公開的可留空

        // ====== 感測器設定 ======
        // tempField / humidField 對應 ThingSpeak 的 field1~field8
        // humidField 設為 null 代表這顆感測器不量測濕度（例如 DS18B20）
        const sensors = [
            { name: "DHT11 #1", tempField: "field1", humidField: "field2" },
            { name: "DHT11 #2", tempField: "field3", humidField: "field4" },
            { name: "DHT11 #3", tempField: "field5", humidField: "field6" },
            { name: "DHT11 #4", tempField: "field7", humidField: null },
            { name: "DS18B20",  tempField: "field8", humidField: null }
        ];

        // 判斷數值是否有效（代表該感測器目前有接通、有回傳資料）
        function isConnected(value) {
            return value !== null && value !== undefined && value !== "" && !isNaN(parseFloat(value));
        }

        async function updateData() {
            let data;

            if (!channelID || channelID === "YOUR_CHANNEL_ID") {
                // 沒有設定 channel 時，用模擬資料方便先看畫面
                data = {};
                sensors.forEach(s => {
                    data[s.tempField] = (25 + Math.random() * 4).toFixed(1);
                    if (s.humidField) data[s.humidField] = (50 + Math.random() * 15).toFixed(1);
                });
            } else {
                const keyParam = readApiKey ? `&api_key=${readApiKey}` : "";
                const url = `https://api.thingspeak.com/channels/${channelID}/feeds/last.json?timezone=Asia/Taipei${keyParam}`;

                try {
                    const response = await fetch(url);
                    data = await response.json();
                } catch (error) {
                    console.error("讀取失敗：", error);
                    return;
                }
            }

            renderSensors(data);
        }

        function renderSensors(data) {
            const tbody = document.getElementById('sensorTableBody');
            tbody.innerHTML = "";

            let tempSum = 0, tempCount = 0;
            let humidSum = 0, humidCount = 0;

            sensors.forEach(s => {
                const tempVal = data[s.tempField];
                const humidVal = s.humidField ? data[s.humidField] : null;

                const tempOK = isConnected(tempVal);
                const humidOK = s.humidField ? isConnected(humidVal) : false;

                // 只要溫度或濕度其中一個有效，就算這顆感測器「連線中」
                const connected = tempOK || humidOK;

                if (tempOK) {
                    tempSum += parseFloat(tempVal);
                    tempCount++;
                }
                if (humidOK) {
                    humidSum += parseFloat(humidVal);
                    humidCount++;
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${s.name}</td>
                    <td>${tempOK ? parseFloat(tempVal).toFixed(1) : '--'}</td>
                    <td>${humidOK ? parseFloat(humidVal).toFixed(1) : (s.humidField ? '--' : '不支援')}</td>
                    <td>
                        <span class="status-dot ${connected ? 'dot-on' : 'dot-off'}"></span>
                        <span class="${connected ? 'status-text-on' : 'status-text-off'}">
                            ${connected ? '已連線' : '未連線'}
                        </span>
                    </td>
                `;
                tbody.appendChild(row);
            });

            const avgTemp = tempCount > 0 ? (tempSum / tempCount).toFixed(1) : '--';
            const avgHumid = humidCount > 0 ? (humidSum / humidCount).toFixed(1) : '--';

            document.getElementById('avgTemp').innerText = avgTemp;
            document.getElementById('avgHumid').innerText = avgHumid;
            document.getElementById('tempCount').innerText = tempCount;
            document.getElementById('humidCount').innerText = humidCount;
            document.getElementById('lastUpdated').innerText = new Date().toLocaleString('zh-TW');

            updateAlert(avgTemp);
        }

        function updateAlert(avgTemp) {
            const alertCard = document.getElementById('alertCard');
            const temp = parseFloat(avgTemp);

            if (isNaN(temp)) {
                alertCard.className = "alert warm";
                alertCard.innerHTML = "目前沒有感測器連線，無法提供建議。";
                return;
            }

            if (temp < 26) {
                alertCard.className = "alert cool";
                alertCard.innerHTML = "平均溫度偏涼，建議開啟電風扇即可，無需開冷氣。";
            } else if (temp >= 26 && temp < 28) {
                alertCard.className = "alert warm";
                alertCard.innerHTML = "冷氣建議設定 27°C + 搭配循環扇。";
            } else {
                alertCard.className = "alert hot";
                alertCard.innerHTML = "室內較熱，請先開窗通風 5 分鐘再開啟冷氣。";
            }
        }

        // ====== 平均溫度歷史圖表 ======
        let avgTempChart = null;

        function setChartStatus(msg) {
            const el = document.getElementById('chartStatus');
            if (el) el.innerText = msg;
        }

        async function updateAvgTempChart() {
            const tempFields = sensors.map(s => s.tempField); // 只看有量溫度的欄位

            if (typeof Chart === 'undefined') {
                setChartStatus('圖表元件（Chart.js）載入失敗，請檢查網路連線或 CDN 是否被擋。');
                return;
            }

            let feeds;

            if (!channelID || channelID === "YOUR_CHANNEL_ID") {
                // 模擬歷史資料
                feeds = Array.from({ length: 30 }, (_, i) => {
                    const entry = { created_at: new Date(Date.now() - (29 - i) * 60000).toISOString() };
                    tempFields.forEach(f => entry[f] = (25 + Math.random() * 4).toFixed(1));
                    return entry;
                });
            } else {
                const keyParam = readApiKey ? `&api_key=${readApiKey}` : "";
                const url = `https://api.thingspeak.com/channels/${channelID}/feeds.json?results=30&timezone=Asia/Taipei${keyParam}`;

                try {
                    const response = await fetch(url);
                    const json = await response.json();
                    feeds = json.feeds || [];
                } catch (error) {
                    console.error("歷史資料讀取失敗：", error);
                    setChartStatus('歷史資料讀取失敗，請確認 channel ID 與網路連線（詳見瀏覽器 Console）。');
                    return;
                }
            }

            // 每一筆資料只用「當下有回傳有效數值」的溫度感測器計算平均，未連線的不列入計算
            const labels = [];
            const avgValues = [];

            feeds.forEach(entry => {
                let sum = 0, count = 0;
                tempFields.forEach(f => {
                    if (isConnected(entry[f])) {
                        sum += parseFloat(entry[f]);
                        count++;
                    }
                });

                if (count > 0) {
                    const time = new Date(entry.created_at);
                    labels.push(time.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }));
                    avgValues.push((sum / count).toFixed(1));
                }
            });

            if (labels.length === 0) {
                setChartStatus('目前沒有任何感測器有歷史資料可計算平均溫度。');
                return;
            }

            setChartStatus('');
            renderAvgTempChart(labels, avgValues);
        }

        function renderAvgTempChart(labels, values) {
            const ctx = document.getElementById('avgTempChart');
            if (!ctx || typeof Chart === 'undefined') return;

            if (avgTempChart) {
                avgTempChart.data.labels = labels;
                avgTempChart.data.datasets[0].data = values;
                avgTempChart.update();
                return;
            }

            avgTempChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '平均溫度 (°C)',
                        data: values,
                        borderColor: '#007bff',
                        backgroundColor: 'rgba(0, 123, 255, 0.1)',
                        tension: 0.3,
                        fill: true,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            title: { display: true, text: '°C' }
                        }
                    }
                }
            });
        }

        updateData();
        updateAvgTempChart();
        setInterval(updateData, 15000);
        setInterval(updateAvgTempChart, 60000); // 歷史圖表資料變動較慢，1 分鐘更新一次即可
    </script>

</body>
</html>
